<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ef5350">
  <title>ポケくじ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
      padding: 32px 20px 60px;
    }

    header {
      text-align: center;
      margin: 45px 0 45px;
    }

    .logo {
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      line-height: 1.7;
    }

    .section-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .game-card {
      width: 100%;
      border: 1px solid #e5e5e5;
      border-radius: 18px;
      background: #fff;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    .game-button {
      width: 100%;
      padding: 20px;
      border: none;
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .game-button:hover {
      background: #fafafa;
    }

    .arrow {
      transition: transform 0.2s ease;
    }

    .game-card.open .arrow {
      transform: rotate(180deg);
    }

    .game-menu {
      display: none;
      padding: 0 14px 14px;
    }

    .game-card.open .game-menu {
      display: block;
    }

    .option {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      background: #f3f4f6;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }

    .option:hover {
      background: #e9eaed;
    }

    .coming {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .selected-box {
      display: none;
      margin-top: 28px;
      padding: 20px;
      border-radius: 18px;
      background: #f7f7f8;
      border: 1px solid #e8e8ea;
    }

    .selected-box.show {
      display: block;
    }

    .selected-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
    }

    .selected-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .draw-button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 14px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .draw-button:hover {
      opacity: 0.88;
    }

    .footer {
      text-align: center;
      margin-top: 45px;
      font-size: 12px;
      color: #aaa;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <main class="app">

    <header>
      <div class="logo">🎲 ポケくじ</div>

      <div class="subtitle">
        ランダムから始まる、いつもと違うバトル。
      </div>
    </header>

    <div class="section-title">
      ゲームを選択
    </div>


    <!-- Pokémon Champions -->
    <div class="game-card">

      <button class="game-button" onclick="toggleMenu(this)">
        <span>Pokémon Champions</span>
        <span class="arrow">▼</span>
      </button>

      <div class="game-menu">

        <button
          class="option"
          onclick="selectGame('Pokémon Champions', 'レギュレーション M-A')">
          レギュレーション M-A
        </button>

        <button
          class="option"
          onclick="selectGame('Pokémon Champions', 'レギュレーション M-B')">
          レギュレーション M-B
        </button>

        <button
          class="option"
          onclick="selectGame('Pokémon Champions', 'レギュレーション M-C')">
          レギュレーション M-C
        </button>

      </div>
    </div>


    <!-- Pokémon Game Series -->
    <div class="game-card">

      <button class="game-button" onclick="toggleMenu(this)">
        <span>ゲームシリーズ</span>
        <span class="arrow">▼</span>
      </button>

      <div class="game-menu">

        <button
          class="option"
          onclick="selectGame('スカーレット・バイオレット', 'ルール選択')">
          スカーレット・バイオレット
        </button>

        <button class="option coming" disabled>
          ソード・シールド　― 今後対応予定
        </button>

      </div>
    </div>


    <!-- 選択結果 -->
    <div id="selectedBox" class="selected-box">

      <div class="selected-label">
        選択中
      </div>

      <div id="selectedTitle" class="selected-title">
      </div>

      <button class="draw-button" onclick="goToDraw()">
        🎲 ポケくじを引く
      </button>

    </div>


    <div class="footer">
      ※非公式のファン向けツールです。<br>
      各ゲーム・作品の権利は各権利者に帰属します。
    </div>

  </main>


  <script>

    let selectedGame = "";
    let selectedRule = "";


    function toggleMenu(button) {

      const card = button.parentElement;

      card.classList.toggle("open");

    }


    function selectGame(game, rule) {

      selectedGame = game;
      selectedRule = rule;

      const selectedBox =
        document.getElementById("selectedBox");

      const selectedTitle =
        document.getElementById("selectedTitle");

      selectedTitle.textContent =
        game + " / " + rule;

      selectedBox.classList.add("show");

    }


    function goToDraw() {

      if (!selectedGame) {
        return;
      }

      const url =
        "draw.html?game=" +
        encodeURIComponent(selectedGame) +
        "&rule=" +
        encodeURIComponent(selectedRule) +
        "&v=3";

      window.location.href = url;

    }

  </script>

</body>
</html>
