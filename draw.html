<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケくじ - 抽選</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
      padding: 28px 20px 60px;
    }

    .back {
      display: inline-block;
      margin-bottom: 30px;
      color: #555;
      text-decoration: none;
      font-weight: 700;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .game {
      font-size: 14px;
      color: #777;
      margin-bottom: 5px;
    }

    .rule {
      font-size: 20px;
      font-weight: 800;
    }

    .result {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .pokemon {
      min-height: 110px;
      border-radius: 16px;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
      text-align: center;
      font-weight: 800;
      color: #333;
      line-height: 1.5;
    }
.pokemon {
  flex-direction: column;
  gap: 8px;
}

.pokemon img {
  width: 90px;
  height: 90px;
  object-fit: contain;
}

.pokemon-name {
  font-size: 14px;
  font-weight: 800;
  text-align: center;
}
    .pokemon.empty {
      color: #aaa;
      font-size: 28px;
    }

    .draw-button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 18px;
      background: #222;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .draw-button:hover {
      opacity: 0.88;
    }

    .sub-button {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 15px;
      background: #fff;
      color: #444;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .message {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 13px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <main class="app">

    <a class="back" href="index.html">
      ← 戻る
    </a>

    <header>
      <div class="logo">🎲 ポケくじ</div>
      <div id="gameName" class="game"></div>
      <div id="ruleName" class="rule"></div>
    </header>

    <div class="result" id="result">
      <div class="pokemon empty">？</div>
      <div class="pokemon empty">？</div>
      <div class="pokemon empty">？</div>
      <div class="pokemon empty">？</div>
      <div class="pokemon empty">？</div>
      <div class="pokemon empty">？</div>
    </div>

    <button class="draw-button" onclick="drawPokemon()">
      🎲 6匹を抽選する
    </button>

    <button class="sub-button" onclick="resetDraw()">
      リセット
    </button>

    <div id="message" class="message">
      選択したルールから、重複なしで6匹を抽選します。
    </div>

  </main>

  <script src="champions-ma.js"></script>
<script src="champions-mb.js"></script>
<script src="champions-mc.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);

    const game = params.get("game") || "";
    const rule = params.get("rule") || "";

    document.getElementById("gameName").textContent = game;
    document.getElementById("ruleName").textContent = rule;

   function getPokemonPool() {

  if (game === "Pokémon Champions") {

    if (rule === "レギュレーション M-A") {
      return championsMA;
    }

    if (rule === "レギュレーション M-B") {
      return championsMB;
    }

    if (rule === "レギュレーション M-C") {
      return championsMC;
    }
  }

  return [];
}

    function drawPokemon() {

      const pool = getPokemonPool();

      if (pool.length < 6) {
        document.getElementById("message").textContent =
          "このルールのポケモンデータはまだ登録されていません。";
        return;
      }

      const shuffled = [...pool];

      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }

      const selected = shuffled.slice(0, 6);

      const slots = document.querySelectorAll(".pokemon");

      slots.forEach((slot, index) => {
  const pokemonName = selected[index];

  slot.innerHTML = `
    <div class="pokemon-name">${pokemonName}</div>
  `;

  slot.classList.remove("empty");
});

      document.getElementById("message").textContent =
        "抽選完了！この6匹で構築してみよう。";
    }

    function resetDraw() {

      const slots = document.querySelectorAll(".pokemon");

      slots.forEach(slot => {
        slot.textContent = "？";
        slot.classList.add("empty");
      });

      document.getElementById("message").textContent =
        "選択したルールから、重複なしで6匹を抽選します。";
    }
  </script>

</body>
</html>
