<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケくじ - 抽選</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
      padding: 28px 20px 60px;
    }

    .back {
      display: inline-block;
      margin-bottom: 30px;
      color: #555;
      text-decoration: none;
      font-weight: 700;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .game {
      font-size: 14px;
      color: #777;
      margin-bottom: 5px;
    }

    .rule {
      font-size: 20px;
      font-weight: 800;
    }

    .result {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .pokemon {
      min-height: 210px;
      border-radius: 16px;
      background: #f3f4f6;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 14px;
      text-align: center;
      color: #333;
      line-height: 1.5;
    }

    .pokemon img {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    .pokemon-name {
      font-size: 14px;
      font-weight: 800;
      text-align: center;
    }

    .pokemon-item,
    .pokemon-nature {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      text-align: center;
    }

    .reroll-button {
      width: 100%;
      margin-top: 4px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 8px 10px;
      background: #fff;
      color: #444;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .pokemon.empty {
      color: #aaa;
      font-size: 28px;
      font-weight: 800;
    }

    .draw-button,
    .share-button,
    .sub-button {
      width: 100%;
      border-radius: 16px;
      padding: 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .draw-button {
      border: none;
      background: #222;
      color: #fff;
      margin-bottom: 12px;
    }

    .share-button {
      border: none;
      background: #4a90e2;
      color: #fff;
      margin-bottom: 12px;
      display: none;
    }

    .sub-button {
      border: 1px solid #ddd;
      background: #fff;
      color: #444;
    }

    .message {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 13px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <main class="app">

    <a class="back" href="index.html">
      ← 戻る
    </a>

    <header>
      <div class="logo">🎲 ポケくじ</div>
      <div id="gameName" class="game"></div>
      <div id="ruleName" class="rule"></div>
    </header>

    <div class="result" id="result">
      <div class="pokemon empty">？</div>
      <div class="pokemon empty">？</div>
      <div class="pokemon empty">？</div>
      <div class="pokemon empty">？</div>
      <div class="pokemon empty">？</div>
      <div class="pokemon empty">？</div>
    </div>

    <button class="draw-button" onclick="drawPokemon()">
      🎲 6匹を抽選する
    </button>

    <button id="shareButton" class="share-button" onclick="shareResult()">
      📤 結果をシェア
    </button>

    <button class="sub-button" onclick="resetDraw()">
      リセット
    </button>

    <div id="message" class="message">
      選択したルールから、重複なしで6匹を抽選します。
    </div>

  </main>

  <script src="champions-ma.js"></script>
  <script src="champions-mb.js"></script>
  <script src="champions-mc.js"></script>
  <script src="champions-items.js"></script>
  <script src="pokemon-images.js"></script>

  <script>

    const params = new URLSearchParams(window.location.search);

    const game = params.get("game") || "";
    const rule = params.get("rule") || "";

    document.getElementById("gameName").textContent = game;
    document.getElementById("ruleName").textContent = rule;

    let currentTeam = [];
    let currentItems = [];
    let currentNatures = [];

    function getPokemonPool() {
      if (game === "Pokémon Champions") {
        if (rule === "レギュレーション M-A") {
          return championsMA;
        }

        if (rule === "レギュレーション M-B") {
          return championsMB;
        }

        if (rule === "レギュレーション M-C") {
          return championsMC;
        }
      }

      return [];
    }

    function getItemPool() {
      if (game === "Pokémon Champions") {
        if (rule === "レギュレーション M-A") {
          return championsItemsMA;
        }

        if (rule === "レギュレーション M-B") {
          return championsItemsMB;
        }

        if (rule === "レギュレーション M-C") {
          return championsItemsMC;
        }
      }

      return [];
    }

    const pokemonNatures = [
      "さみしがり",
      "いじっぱり",
      "やんちゃ",
      "ゆうかん",
      "ずぶとい",
      "わんぱく",
      "のうてんき",
      "のんき",
      "ひかえめ",
      "おっとり",
      "うっかりや",
      "れいせい",
      "おだやか",
      "おとなしい",
      "しんちょう",
      "なまいき",
      "おくびょう",
      "せっかち",
      "ようき",
      "むじゃき",
      "てれや",
      "がんばりや",
      "すなお",
      "きまぐれ",
      "まじめ"
    ];

    function getRandomNature() {
      return pokemonNatures[
        Math.floor(Math.random() * pokemonNatures.length)
      ];
    }

    function shuffleArray(array) {
      const shuffled = [...array];

      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[j]] =
          [shuffled[j], shuffled[i]];
      }

      return shuffled;
    }

    async function renderSlot(index) {
      const slots =
        document.querySelectorAll(".pokemon");

      const slot = slots[index];

      const pokemonName = currentTeam[index];
      const itemName = currentItems[index];
      const natureName = currentNatures[index];

      slot.innerHTML = `
        <div class="pokemon-name">${pokemonName}</div>
        <div class="pokemon-item">持ち物：${itemName}</div>
        <div class="pokemon-nature">性格：${natureName}</div>
        <button class="reroll-button" onclick="rerollPokemon(${index})">
          🔄 この1匹だけ引き直す
        </button>
      `;

      slot.classList.remove("empty");

      const imageUrl =
        await getPokemonImage(pokemonName);

      if (imageUrl) {
        slot.innerHTML = `
          <img src="${imageUrl}" alt="${pokemonName}">
          <div class="pokemon-name">${pokemonName}</div>
          <div class="pokemon-item">持ち物：${itemName}</div>
          <div class="pokemon-nature">性格：${natureName}</div>
          <button class="reroll-button" onclick="rerollPokemon(${index})">
            🔄 この1匹だけ引き直す
          </button>
        `;
      }
    }

    async function drawPokemon() {
      const pool = getPokemonPool();
      const itemPool = getItemPool();

      if (pool.length < 6 || itemPool.length < 6) {
        document.getElementById("message").textContent =
          "このルールのデータはまだ登録されていません。";

        return;
      }

      currentTeam =
        shuffleArray(pool).slice(0, 6);

      currentItems =
        shuffleArray(itemPool).slice(0, 6);

      currentNatures = [];

      for (let i = 0; i < 6; i++) {
        currentNatures.push(getRandomNature());
      }

      for (let i = 0; i < 6; i++) {
        renderSlot(i);
      }

      document.getElementById("shareButton").style.display =
        "block";

      document.getElementById("message").textContent =
        "抽選完了！6匹・持ち物・性格を決定しました。";
    }

    async function rerollPokemon(index) {
      const pool = getPokemonPool();
      const itemPool = getItemPool();

      if (currentTeam.length !== 6) {
        return;
      }

      const usedPokemon =
        currentTeam.filter((_, i) => i !== index);

      const availablePokemon =
        pool.filter(name => !usedPokemon.includes(name));

      const usedItems =
        currentItems.filter((_, i) => i !== index);

      const availableItems =
        itemPool.filter(item => !usedItems.includes(item));

      if (
        availablePokemon.length === 0 ||
        availableItems.length === 0
      ) {
        return;
      }

      const oldPokemon =
        currentTeam[index];

      let newPokemon =
        availablePokemon[
          Math.floor(Math.random() * availablePokemon.length)
        ];

      if (availablePokemon.length > 1) {
        while (newPokemon === oldPokemon) {
          newPokemon =
            availablePokemon[
              Math.floor(Math.random() * availablePokemon.length)
            ];
        }
      }

      currentTeam[index] = newPokemon;

      currentItems[index] =
        availableItems[
          Math.floor(Math.random() * availableItems.length)
        ];

      currentNatures[index] =
        getRandomNature();

      await renderSlot(index);

      document.getElementById("message").textContent =
        `${oldPokemon}を引き直しました。`;
    }

    async function shareResult() {
      if (currentTeam.length !== 6) {
        return;
      }

      const teamText =
        currentTeam.join(" / ");

      const shareText =
`🎲 ポケくじでランダム構築！

${rule}

${teamText}

#ポケくじ #ポケモンチャンピオンズ`;

      const shareUrl =
        "https://nico25dayo.github.io/poke-kuji/";

      if (navigator.share) {
        try {
          await navigator.share({
            title: "ポケくじ",
            text: shareText,
            url: shareUrl
          });
        } catch (error) {
          console.log("共有をキャンセルしました。");
        }
      } else {
        const copyText =
          shareText + "\n" + shareUrl;

        await navigator.clipboard.writeText(copyText);

        document.getElementById("message").textContent =
          "共有文をコピーしました！";
      }
    }

    function resetDraw() {
      currentTeam = [];
      currentItems = [];
      currentNatures = [];

      const slots =
        document.querySelectorAll(".pokemon");

      slots.forEach(slot => {
        slot.textContent = "？";
        slot.classList.add("empty");
      });

      document.getElementById("shareButton").style.display =
        "none";

      document.getElementById("message").textContent =
        "選択したルールから、重複なしで6匹を抽選します。";
    }

  </script>

</body>
</html>
