<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケくじ - 抽選</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ef5350">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ポケくじ">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
      padding: 28px 20px 60px;
    }

    .back {
      display: inline-block;
      margin-bottom: 30px;
      color: #555;
      text-decoration: none;
      font-weight: 700;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .game {
      font-size: 14px;
      color: #777;
      margin-bottom: 5px;
    }

    .rule {
      font-size: 20px;
      font-weight: 800;
    }

    .result {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .pokemon {
      min-height: 230px;
      border-radius: 16px;
      background: #f3f4f6;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 14px;
      text-align: center;
    }

    .pokemon.mega {
      border: 2px solid #f2b84b;
      background: #fffaf0;
    }

    .pokemon img {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    .mega-label {
      font-size: 11px;
      font-weight: 900;
      color: #b87300;
    }

    .pokemon-name {
      font-size: 14px;
      font-weight: 800;
    }

    .pokemon-item,
    .pokemon-nature {
      font-size: 12px;
      font-weight: 600;
      color: #666;
    }

    .reroll-button {
      width: 100%;
      margin-top: 4px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 8px 10px;
      background: #fff;
      color: #444;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .pokemon.empty {
      color: #aaa;
      font-size: 28px;
      font-weight: 800;
    }

    .draw-button,
    .image-button,
    .share-button,
    .ask-button,
    .sub-button {
      width: 100%;
      border-radius: 16px;
      padding: 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .draw-button {
      border: none;
      background: #222;
      color: #fff;
      margin-bottom: 12px;
    }

    .image-button {
      border: none;
      background: #666;
      color: #fff;
      margin-bottom: 12px;
      display: none;
    }

    .share-button {
      border: none;
      background: #4a90e2;
      color: #fff;
      margin-bottom: 12px;
      display: none;
    }

    .ask-button {
      border: none;
      background: #111;
      color: #fff;
      margin-bottom: 12px;
      display: none;
    }

    .sub-button {
      border: 1px solid #ddd;
      background: #fff;
      color: #444;
    }

    .message {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 13px;
      line-height: 1.7;
    }

    .share-preview {
      margin-top: 24px;
      display: none;
    }

    .share-preview.show {
      display: block;
    }

    .share-preview img {
      width: 100%;
      border-radius: 16px;
      border: 1px solid #e5e5e5;
      display: block;
    }
  </style>
</head>

<body>

<main class="app">

  <a class="back" href="index.html">
    ← 戻る
  </a>

  <header>
    <div class="logo">🎲 ポケくじ</div>
    <div id="gameName" class="game"></div>
    <div id="ruleName" class="rule"></div>
  </header>

  <div class="result">
    <div class="pokemon empty">？</div>
    <div class="pokemon empty">？</div>
    <div class="pokemon empty">？</div>
    <div class="pokemon empty">？</div>
    <div class="pokemon empty">？</div>
    <div class="pokemon empty">？</div>
  </div>

  <button class="draw-button" onclick="drawPokemon()">
    🎲 6匹を抽選する
  </button>

  <button
    id="imageButton"
    class="image-button"
    onclick="createShareImage()">
    📸 シェア画像を作る
  </button>

  <button
    id="shareButton"
    class="share-button"
    onclick="shareResult()">
    📤 結果をシェア
  </button>

  <button
    id="askButton"
    class="ask-button"
    onclick="askOnX()">
    𝕏 この6匹でみんなに相談
  </button>

    リセット
  </button>

  <div id="sharePreview" class="share-preview">
    <img id="sharePreviewImage" alt="ポケくじ シェア画像">
  </div>

  <div id="message" class="message">
    選択したルールから、重複なしで6匹を抽選します。
  </div>

</main>


<!-- =========================

========================= -->

<script src="champions-ma.js"></script>
<script src="champions-mb.js"></script>

<script src="champions-items.js"></script>
<script src="champions-mega.js"></script>


<!-- =========================
     Scarlet / Violet
========================= -->

<script src="sv-reg-a.js"></script>
<script src="sv-reg-b.js"></script>
<script src="sv-reg-h.js"></script>
<script src="sv-reg-j.js"></script>
<script src="sv-items.js"></script>


<!-- Pokémon Images -->

<script src="pokemon-images.js?v=4"></script>


<script>
  const params =
    new URLSearchParams(
      window.location.search
    );

  const game =
    params.get("game") || "";

  const rule =
    params.get("rule") || "";

  document.getElementById(
    "gameName"
  ).textContent = game;

  document.getElementById(
    "ruleName"
  ).textContent = rule;


  let currentTeam = [];
  let currentItems = [];
  let currentNatures = [];
  let currentImageUrls = [];

  let currentMegaEnabled = false;
  let currentMegaIndex = -1;
  let currentMegaStone = "";

  let shareImageBlob = null;
  let previewObjectUrl = null;


  const pokemonNatures = [
    "さみしがり",
    "いじっぱり",
    "やんちゃ",
    "ゆうかん",

    "ずぶとい",
    "わんぱく",
    "のうてんき",
    "のんき",

    "ひかえめ",
    "おっとり",
    "うっかりや",
    "れいせい",

    "おだやか",
    "おとなしい",
    "しんちょう",
    "なまいき",

    "おくびょう",
    "せっかち",
    "ようき",
    "むじゃき",

    "てれや",
    "がんばりや",
    "すなお",
    "きまぐれ",
    "まじめ"
  ];


  function isChampions() {
    return game ===
      "Pokémon Champions";
  }


  function isSV() {
    return game ===
      "スカーレット・バイオレット";
  }


  function isSVRegJ() {
    return (
      isSV() &&
      rule === "レギュレーション J"
    );
  }


  function getGameHashtag() {
    if (isSV()) {
      return "#ポケモンSV";
    }

    return "#ポケモンチャンピオンズ";
  }


  function getRandomNature() {
    return pokemonNatures[
      Math.floor(
        Math.random() *
        pokemonNatures.length
      )
    ];
  }


  // =========================
  // ポケモンプール
  // =========================

  function getPokemonPool() {

    if (isChampions()) {

      if (
        rule ===
        "レギュレーション M-A"
      ) {
        return championsMA;
      }

      if (
        rule ===
        "レギュレーション M-B"
      ) {
        return championsMB;
      }

      if (
        rule ===
        "レギュレーション M-C"
      ) {
        return championsMC;
      }
    }


    if (isSV()) {

      if (
        rule ===
        "レギュレーション A"
      ) {
        return svRegA;
      }

      if (
        rule ===
        "レギュレーション B"
      ) {
        return svRegB;
      }

      if (
        rule ===
        "レギュレーション H"
      ) {
        return svRegH;
      }

      if (
        rule ===
        "レギュレーション J"
      ) {
        return svRegJ;
      }
    }


    return [];
  }


  // =========================
  // 持ち物プール
  // =========================

  function getItemPool() {

    if (isChampions()) {

      if (
        rule ===
        "レギュレーション M-A"
      ) {
        return championsItemsMA;
      }

      if (
        rule ===
        "レギュレーション M-B"
      ) {
        return championsItemsMB;
      }

      if (
        rule ===
        "レギュレーション M-C"
      ) {
        return championsItemsMC;
      }
    }


    if (isSV()) {

      if (
        rule ===
        "レギュレーション A"
      ) {
        return svItemsA;
      }

      if (
        rule ===
        "レギュレーション B"
      ) {
        return svItemsB;
      }

      if (
        rule ===
        "レギュレーション H"
      ) {
        return svItemsH;
      }

      if (
        rule ===
        "レギュレーション J"
      ) {
        return svItemsJ;
      }
    }


    return [];
  }


  function shuffleArray(array) {
    const shuffled =
      [...array];

    for (
      let i =
        shuffled.length - 1;
      i > 0;
      i--
    ) {
      const j =
        Math.floor(
          Math.random() *
          (i + 1)
        );

      [
        shuffled[i],
        shuffled[j]
      ] = [
        shuffled[j],
        shuffled[i]
      ];
    }

    return shuffled;
  }


  // =========================
  // 同一ポケモン判定
  //
  // フォルム違いが同時に
  // 選ばれにくいようにする
  // =========================

  function getSpeciesKey(name) {

    if (!name) {
      return "";
    }

    return name
      .replace(/（.*?）/g, "")
      .trim();
  }


  function hasSameSpecies(
    team,
    pokemonName
  ) {
    const key =
      getSpeciesKey(
        pokemonName
      );

    return team.some(
      pokemon =>
        getSpeciesKey(pokemon)
          === key
    );
  }


  // =========================
  // J 特別枠
  // =========================

  function isSVJSpecialPokemon(
    pokemonName
  ) {
    if (
      typeof svRegJSpecial ===
      "undefined"
    ) {
      return false;
    }

    return svRegJSpecial.includes(
      pokemonName
    );
  }


  function countSpecialPokemon(
    team
  ) {
    return team.filter(
      pokemon =>
        isSVJSpecialPokemon(
          pokemon
        )
    ).length;
  }


  // =========================
  // メガ
  // Championsのみ
  // =========================

  function chooseMegaOption(
    pokemonName
  ) {
    if (!isChampions()) {
      return null;
    }

    const options =
      getMegaOptions(
        pokemonName,
        rule
      );

    if (
      options.length === 0
    ) {
      return null;
    }

    return options[
      Math.floor(
        Math.random() *
        options.length
      )
    ];
  }


  // =========================
  // 通常6匹抽選
  // =========================

  function buildNormalTeam(
    pool
  ) {
    const shuffled =
      shuffleArray(pool);

    const team = [];

    for (
      const pokemon
      of shuffled
    ) {

      if (
        hasSameSpecies(
          team,
          pokemon
        )
      ) {
        continue;
      }

      team.push(pokemon);

      if (
        team.length === 6
      ) {
        break;
      }
    }

    return team;
  }


  // =========================
  // SV J抽選
  // 特別なポケモン最大2匹
  // =========================

  function buildSVRegJTeam(
    pool
  ) {
    const shuffled =
      shuffleArray(pool);

    const team = [];

    let specialCount = 0;

    for (
      const pokemon
      of shuffled
    ) {

      if (
        hasSameSpecies(
          team,
          pokemon
        )
      ) {
        continue;
      }

      const isSpecial =
        isSVJSpecialPokemon(
          pokemon
        );

      if (
        isSpecial &&
        specialCount >= 2
      ) {
        continue;
      }

      team.push(
        pokemon
      );

      if (isSpecial) {
        specialCount++;
      }

      if (
        team.length === 6
      ) {
        break;
      }
    }

    return team;
  }


  // =========================
  // チーム構築
  // =========================

  function buildTeam() {

    const pool =
      getPokemonPool();

    const itemPool =
      getItemPool();


    // -------------------------
    // Scarlet / Violet
    // -------------------------

    if (isSV()) {

      currentMegaEnabled = false;
      currentMegaIndex = -1;
      currentMegaStone = "";

      if (isSVRegJ()) {

        currentTeam =
          buildSVRegJTeam(
            pool
          );

      } else {

        currentTeam =
          buildNormalTeam(
            pool
          );
      }

      currentItems =
        shuffleArray(
          itemPool
        ).slice(0, 6);

      return;
    }


    // -------------------------
    // Pokémon Champions
    // -------------------------

    currentMegaEnabled =
      Math.random() < 0.5;

    currentMegaIndex = -1;
    currentMegaStone = "";


    if (
      currentMegaEnabled
    ) {

      const megaCandidates =
        pool.filter(
          name =>
            getMegaOptions(
              name,
              rule
            ).length > 0
        );


      if (
        megaCandidates.length > 0
      ) {

        const megaPokemon =
          megaCandidates[
            Math.floor(
              Math.random() *
              megaCandidates.length
            )
          ];


        const remainingPool =
          pool.filter(
            name =>
              getSpeciesKey(name)
              !==
              getSpeciesKey(
                megaPokemon
              )
          );


        const otherFive =
          buildNormalTeam(
            remainingPool
          ).slice(0, 5);


        currentTeam =
          shuffleArray([
            megaPokemon,
            ...otherFive
          ]);


        currentMegaIndex =
          currentTeam.indexOf(
            megaPokemon
          );


        const megaOption =
          chooseMegaOption(
            megaPokemon
          );


        currentMegaStone =
          megaOption
            ? megaOption.stone
            : "";

      } else {

        currentMegaEnabled =
          false;

        currentTeam =
          buildNormalTeam(
            pool
          );
      }

    } else {

      currentTeam =
        buildNormalTeam(
          pool
        );
    }


    currentItems =
      shuffleArray(
        itemPool
      ).slice(0, 6);


    if (
      currentMegaEnabled &&
      currentMegaIndex >= 0 &&
      currentMegaStone
    ) {

      currentItems[
        currentMegaIndex
      ] =
        currentMegaStone;
    }
  }


  // =========================
  // 表示
  // =========================

  async function renderSlot(
    index
  ) {

    const slots =
      document.querySelectorAll(
        ".pokemon"
      );

    const slot =
      slots[index];

    const pokemonName =
      currentTeam[index];

    const itemName =
      currentItems[index];

    const natureName =
      currentNatures[index];


    const isMega =
      isChampions() &&
      currentMegaEnabled &&
      index ===
        currentMegaIndex;


    slot.classList.remove(
      "empty",
      "mega"
    );


    if (isMega) {
      slot.classList.add(
        "mega"
      );
    }


    const imageUrl =
      await getPokemonImage(
        pokemonName
      );


    currentImageUrls[
      index
    ] =
      imageUrl || "";


    const megaLabel =
      isMega
        ? `<div class="mega-label">⭐ メガ枠</div>`
        : "";


    slot.innerHTML = `
      ${
        imageUrl
          ? `<img src="${imageUrl}" alt="${pokemonName}">`
          : ""
      }

      ${megaLabel}

      <div class="pokemon-name">
        ${pokemonName}
      </div>

      <div class="pokemon-item">
        持ち物：${itemName}
      </div>

      <div class="pokemon-nature">
        性格：${natureName}
      </div>

      <button
        class="reroll-button"
        onclick="rerollPokemon(${index})">
        🔄 この1匹だけ引き直す
      </button>
    `;
  }


  async function renderAllSlots() {

    await Promise.all(
      currentTeam.map(
        (_, index) =>
          renderSlot(index)
      )
    );
  }


  // =========================
  // 抽選
  // =========================

  async function drawPokemon() {

    const pool =
      getPokemonPool();

    const itemPool =
      getItemPool();


    if (
      pool.length < 6 ||
      itemPool.length < 6
    ) {

      document.getElementById(
        "message"
      ).textContent =
        "このルールのデータはまだ登録されていません。";

      return;
    }


    buildTeam();


    if (
      currentTeam.length < 6
    ) {

      document.getElementById(
        "message"
      ).textContent =
        "6匹を抽選できませんでした。データを確認してください。";

      return;
    }


    currentNatures = [];
    currentImageUrls = [];


    for (
      let i = 0;
      i < 6;
      i++
    ) {

      currentNatures.push(
        getRandomNature()
      );
    }


    hideOldPreview();

    await renderAllSlots();


    document.getElementById(
      "imageButton"
    ).style.display =
      "block";


    document.getElementById(
      "shareButton"
    ).style.display =
      "block";


    document.getElementById(
      "askButton"
    ).style.display =
      "block";


    if (isSVRegJ()) {

      const specialCount =
        countSpecialPokemon(
          currentTeam
        );

      document.getElementById(
        "message"
      ).textContent =
        `抽選完了！特別なポケモンは${specialCount}匹です。`;

      return;
    }


    if (isSV()) {

      document.getElementById(
        "message"
      ).textContent =
        "抽選完了！";

      return;
    }


    if (
      currentMegaEnabled &&
      currentMegaIndex >= 0
    ) {

      document.getElementById(
        "message"
      ).textContent =
        `抽選完了！今回は${currentTeam[currentMegaIndex]}がメガ枠です。`;

    } else {

      document.getElementById(
        "message"
      ).textContent =
        "抽選完了！今回はメガ枠なしです。";
    }
  }


  // =========================
  // 使用していない持ち物
  // =========================

  function getAvailableNormalItem(
    index
  ) {

    const itemPool =
      getItemPool();


    const usedItems =
      currentItems.filter(
        (_, i) =>
          i !== index
      );


    const availableItems =
      itemPool.filter(
        item =>
          !usedItems.includes(
            item
          )
      );


    if (
      availableItems.length === 0
    ) {
      return "";
    }


    return availableItems[
      Math.floor(
        Math.random() *
        availableItems.length
      )
    ];
  }


  // =========================
  // 引き直し候補
  // =========================

  function getAvailablePokemon(
    index
  ) {

    const pool =
      getPokemonPool();


    const otherPokemon =
      currentTeam.filter(
        (_, i) =>
          i !== index
      );


    return pool.filter(
      pokemon => {

        if (
          pokemon ===
          currentTeam[index]
        ) {
          return false;
        }


        if (
          hasSameSpecies(
            otherPokemon,
            pokemon
          )
        ) {
          return false;
        }


        // Jで既に他5匹に
        // 特別枠が2匹いる場合、
        // 特別なポケモンは候補外

        if (isSVRegJ()) {

          const otherSpecialCount =
            countSpecialPokemon(
              otherPokemon
            );


          if (
            otherSpecialCount >= 2 &&
            isSVJSpecialPokemon(
              pokemon
            )
          ) {
            return false;
          }
        }


        return true;
      }
    );
  }


  function getAvailableMegaPokemon(
    index
  ) {

    if (!isChampions()) {
      return [];
    }


    return getAvailablePokemon(
      index
    ).filter(
      pokemon =>
        getMegaOptions(
          pokemon,
          rule
        ).length > 0
    );
  }


  // =========================
  // 1匹引き直し
  // =========================

  async function rerollPokemon(
    index
  ) {

    if (
      currentTeam.length !== 6
    ) {
      return;
    }


    const oldPokemon =
      currentTeam[index];


    const isMegaSlot =
      isChampions() &&
      currentMegaEnabled &&
      index ===
        currentMegaIndex;


    if (isMegaSlot) {

      const megaPool =
        getAvailableMegaPokemon(
          index
        );


      if (
        megaPool.length === 0
      ) {
        return;
      }


      const newPokemon =
        megaPool[
          Math.floor(
            Math.random() *
            megaPool.length
          )
        ];


      const megaOption =
        chooseMegaOption(
          newPokemon
        );


      currentTeam[index] =
        newPokemon;


      currentMegaStone =
        megaOption
          ? megaOption.stone
          : "";


      currentItems[index] =
        currentMegaStone;

    } else {

      const availablePokemon =
        getAvailablePokemon(
          index
        );


      if (
        availablePokemon.length === 0
      ) {
        return;
      }


      currentTeam[index] =
        availablePokemon[
          Math.floor(
            Math.random() *
            availablePokemon.length
          )
        ];


      currentItems[index] =
        getAvailableNormalItem(
          index
        );
    }


    currentNatures[index] =
      getRandomNature();


    hideOldPreview();

    await renderSlot(index);


    document.getElementById(
      "message"
    ).textContent =
      `${oldPokemon}を引き直しました。`;
  }


  // =========================
  // Canvas用画像
  // =========================

  function loadImageForCanvas(
    src
  ) {

    return new Promise(
      resolve => {

        if (!src) {
          resolve(null);
          return;
        }


        const img =
          new Image();


        img.crossOrigin =
          "anonymous";


        img.onload =
          () =>
            resolve(img);


        img.onerror =
          () =>
            resolve(null);


        img.src = src;
      }
    );
  }


  function drawRoundedRect(
    ctx,
    x,
    y,
    width,
    height,
    radius,
    fillStyle
  ) {

    ctx.beginPath();

    ctx.roundRect(
      x,
      y,
      width,
      height,
      radius
    );

    ctx.fillStyle =
      fillStyle;

    ctx.fill();

    ctx.closePath();
  }


  // =========================
  // シェア画像
  // =========================

  async function createShareImage() {

    if (
      currentTeam.length !== 6
    ) {
      return;
    }


    document.getElementById(
      "message"
    ).textContent =
      "シェア画像を作成中…";


    currentImageUrls =
      await Promise.all(
        currentTeam.map(
          name =>
            getPokemonImage(
              name
            )
        )
      );


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width = 1080;
    canvas.height = 1350;


    const ctx =
      canvas.getContext(
        "2d"
      );


    ctx.fillStyle =
      "#f5f6f8";


    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    drawRoundedRect(
      ctx,
      50,
      40,
      980,
      1260,
      36,
      "#ffffff"
    );


    ctx.textAlign =
      "center";


    ctx.fillStyle =
      "#222";


    ctx.font =
      "900 60px sans-serif";


    ctx.fillText(
      "🎲 ポケくじ",
      540,
      120
    );


    ctx.fillStyle =
      "#666";


    ctx.font =
      "700 25px sans-serif";


    ctx.fillText(
      game,
      540,
      165
    );


    ctx.fillStyle =
      "#777";


    ctx.font =
      "700 29px sans-serif";


    ctx.fillText(
      rule,
      540,
      205
    );


    const loadedImages =
      await Promise.all(
        currentImageUrls.map(
          url =>
            loadImageForCanvas(
              url
            )
        )
      );


    const cardWidth =
      430;

    const cardHeight =
      285;

    const startX =
      90;

    const startY =
      235;

    const gapX =
      40;

    const gapY =
      25;


    for (
      let i = 0;
      i < 6;
      i++
    ) {

      const col =
        i % 2;


      const row =
        Math.floor(
          i / 2
        );


      const x =
        startX +
        col *
        (
          cardWidth +
          gapX
        );


      const y =
        startY +
        row *
        (
          cardHeight +
          gapY
        );


      const isMega =
        isChampions() &&
        currentMegaEnabled &&
        i ===
          currentMegaIndex;


      drawRoundedRect(
        ctx,
        x,
        y,
        cardWidth,
        cardHeight,
        28,
        isMega
          ? "#fff7e6"
          : "#f3f4f6"
      );


      if (isMega) {

        ctx.fillStyle =
          "#b87300";


        ctx.font =
          "900 20px sans-serif";


        ctx.textAlign =
          "center";


        ctx.fillText(
          "⭐ メガ枠",
          x +
          cardWidth / 2,
          y + 27
        );
      }


      const img =
        loadedImages[i];


      if (img) {

        const imageSize =
          120;


        ctx.drawImage(
          img,
          x +
          (
            cardWidth -
            imageSize
          ) / 2,
          y + 30,
          imageSize,
          imageSize
        );
      }


      ctx.fillStyle =
        "#222";


      ctx.font =
        "800 27px sans-serif";


      ctx.textAlign =
        "center";


      ctx.fillText(
        currentTeam[i],
        x +
        cardWidth / 2,
        y + 175,
        cardWidth - 30
      );


      ctx.fillStyle =
        isMega
          ? "#9a6500"
          : "#666";


      ctx.font =
        "600 21px sans-serif";


      ctx.fillText(
        `持ち物：${currentItems[i]}`,
        x +
        cardWidth / 2,
        y + 218,
        cardWidth - 30
      );


      ctx.fillStyle =
        "#666";


      ctx.fillText(
        `性格：${currentNatures[i]}`,
        x +
        cardWidth / 2,
        y + 252,
        cardWidth - 30
      );
    }


    ctx.fillStyle =
      "#888";


    ctx.font =
      "600 23px sans-serif";


    ctx.textAlign =
      "center";


    ctx.fillText(
      `#ポケくじ  ${getGameHashtag()}`,
      540,
      1225
    );


    const blob =
      await new Promise(
        resolve => {

          canvas.toBlob(
            resolve,
            "image/png",
            1
          );
        }
      );


    if (!blob) {

      document.getElementById(
        "message"
      ).textContent =
        "シェア画像を作成できませんでした。";

      return;
    }


    shareImageBlob =
      blob;


    if (
      previewObjectUrl
    ) {

      URL.revokeObjectURL(
        previewObjectUrl
      );
    }


    previewObjectUrl =
      URL.createObjectURL(
        blob
      );


    document.getElementById(
      "sharePreviewImage"
    ).src =
      previewObjectUrl;


    document.getElementById(
      "sharePreview"
    ).classList.add(
      "show"
    );


    document.getElementById(
      "message"
    ).textContent =
      "シェア画像を作成しました！";
  }


  function hideOldPreview() {

    document.getElementById(
      "sharePreview"
    ).classList.remove(
      "show"
    );


    shareImageBlob =
      null;
  }


  // =========================
  // 共有
  // =========================

  async function shareResult() {

    if (
      currentTeam.length !== 6
    ) {
      return;
    }


    if (!shareImageBlob) {
      await createShareImage();
    }


    if (!shareImageBlob) {
      return;
    }


    const teamText =
      currentTeam.join(
        " / "
      );


    const megaText =
      isChampions() &&
      currentMegaEnabled &&
      currentMegaIndex >= 0

        ? `\n⭐ メガ枠：${currentTeam[currentMegaIndex]}（${currentMegaStone}）\n`

        : "";


    const shareText =
`🎲 ポケくじでランダム構築！

${game}
${rule}

${teamText}
${megaText}
#ポケくじ ${getGameHashtag()}`;


    const shareUrl =
      "https://nico25dayo.github.io/poke-kuji/";


    const file =
      new File(
        [shareImageBlob],
        "poke-kuji-result.png",
        {
          type:
            "image/png"
        }
      );


    const canShareFile =
      navigator.canShare &&
      navigator.canShare({
        files: [file]
      });


    if (
      navigator.share &&
      canShareFile
    ) {

      try {

        await navigator.share({
          title:
            "ポケくじ",

          text:
            shareText,

          url:
            shareUrl,

          files:
            [file]
        });

      } catch (error) {

        console.log(
          "共有をキャンセルしました。"
        );
      }

      return;
    }


    if (
      navigator.share
    ) {

      try {

        await navigator.share({
          title:
            "ポケくじ",

          text:
            shareText,

          url:
            shareUrl
        });

      } catch (error) {

        console.log(
          "共有をキャンセルしました。"
        );
      }

      return;
    }


    await navigator.clipboard
      .writeText(
        shareText +
        "\n" +
        shareUrl
      );


    document.getElementById(
      "message"
    ).textContent =
      "共有文をコピーしました！";
  }


  // =========================
  // Xで相談
  // =========================

  function askOnX() {

    if (
      currentTeam.length !== 6
    ) {
      return;
    }


    const teamText =
      currentTeam.join(
        " / "
      );


    const megaText =
      isChampions() &&
      currentMegaEnabled &&
      currentMegaIndex >= 0

        ? `\n⭐ メガ枠：${currentTeam[currentMegaIndex]}（${currentMegaStone}）\n`

        : "";


    const text =
`🎲 ポケくじでこの6匹が出ました！

${game}
${rule}

${teamText}
${megaText}
この6匹、みんなならどう組む？🤔

#ポケくじ ${getGameHashtag()}`;


    const siteUrl =
      "https://nico25dayo.github.io/poke-kuji/";


    const xUrl =
      "https://twitter.com/intent/tweet?text=" +
      encodeURIComponent(
        text
      ) +
      "&url=" +
      encodeURIComponent(
        siteUrl
      );


    window.open(
      xUrl,
      "_blank"
    );
  }


  // =========================
  // リセット
  // =========================

  function resetDraw() {

    currentTeam = [];
    currentItems = [];
    currentNatures = [];
    currentImageUrls = [];

    currentMegaEnabled = false;
    currentMegaIndex = -1;
    currentMegaStone = "";

    shareImageBlob = null;


    const slots =
      document.querySelectorAll(
        ".pokemon"
      );


    slots.forEach(
      slot => {

        slot.textContent =
          "？";


        slot.classList.add(
          "empty"
        );


        slot.classList.remove(
          "mega"
        );
      }
    );


    document.getElementById(
      "imageButton"
    ).style.display =
      "none";


    document.getElementById(
      "shareButton"
    ).style.display =
      "none";


    document.getElementById(
      "askButton"
    ).style.display =
      "none";


    hideOldPreview();


    document.getElementById(
      "message"
    ).textContent =
      "選択したルールから、重複なしで6匹を抽選します。";
  }
</script>
