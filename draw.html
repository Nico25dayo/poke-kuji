function getAvailableChallenges() {

  return challengeList.filter(
    challenge => {

      if (
        challenge.championsOnly &&
        !isChampions()
      ) {
        return false;
      }

      if (
        challenge.svJOnly &&
        !isSVRegJ()
      ) {
        return false;
      }

      return true;
    }
  );
}


function chooseRandomChallenge(
  excludeId = ""
) {

  const available =
    getAvailableChallenges()
      .filter(
        challenge =>
          challenge.id !== excludeId
      );

  if (
    available.length === 0
  ) {
    return null;
  }

  return available[
    Math.floor(
      Math.random() *
      available.length
    )
  ];
}


function challengeBlocksPokemonReroll() {

  return Boolean(
    challengeModeActive &&
    currentChallenge &&
    currentChallenge.noPokemonReroll

}


function challengeBlocksItemReroll() {

  return Boolean(
    challengeModeActive &&
    currentChallenge &&
    currentChallenge.noItemReroll

}


function challengeBlocksNatureReroll() {

  return Boolean(
    challengeModeActive &&
    currentChallenge &&
    currentChallenge.noNatureReroll

}


function challengeBlocksLock() {

  return Boolean(
    challengeModeActive &&
    currentChallenge &&
    currentChallenge.noLock

}


function challengeBlocksMega() {

  return Boolean(
    challengeModeActive &&
    currentChallenge &&

function getChallengeMaxSpecial() {

  if (
    challengeModeActive &&
    currentChallenge &&
    Number.isInteger(
      currentChallenge.maxSpecial
    )
  ) {
    return currentChallenge.maxSpecial;
  }

  return 2;
}


function updateChallengePanel() {

  const panel =
    document.getElementById(
      "challengePanel"
    );

  const button =
    document.getElementById(
      "challengeButton"
    );

  if (
    !challengeModeActive ||
    !currentChallenge

    panel.classList.remove(
      "show"
    );

    button.classList.remove(
      "active"
    );

    button.textContent =
      "🔥 チャレンジモード";

    return;
  }

  panel.classList.add(
    "show"
  );

  button.classList.add(
    "active"
  );

  button.textContent =
    "🔥 同じチャレンジでもう一度";

  document.getElementById(
    "challengeTitle"
  ).textContent =
    currentChallenge.title;

  document.getElementById(
    "challengeDescription"
  ).textContent =
    currentChallenge.description;
}


function prepareFreshChallengeDraw() {

  currentTeam = [];
  currentItems = [];
  currentNatures = [];
  currentImageUrls = [];

  lockedSlots =
    Array(6).fill(false);

  currentMegaEnabled = false;
  currentMegaIndex = -1;
  currentMegaStone = "";

  hideOldPreview();
}


async function startChallengeMode() {

  if (
    !challengeModeActive
  ) {

    challengeModeActive =
      true;

    currentChallenge =
      chooseRandomChallenge();
  }

  prepareFreshChallengeDraw();

  updateChallengePanel();

  await drawPokemon();
}


async function changeChallenge() {

  if (
    !challengeModeActive
  ) {
    return;
  }

  const oldId =
    currentChallenge
      ? currentChallenge.id
      : "";

  currentChallenge =
    chooseRandomChallenge(
      oldId
    );

  prepareFreshChallengeDraw();

  updateChallengePanel();

  await drawPokemon();
}


async function endChallengeMode() {

  challengeModeActive =
    false;

  currentChallenge =
    null;

  updateChallengePanel();

  if (
    currentTeam.length === 6
  ) {
    await renderAllSlots();
  }

  document.getElementById(
    "message"
  ).textContent =
    "チャレンジモードを終了しました。";
}


function setChallengeMessage() {

  if (

  document.getElementById(

    `🔥 ${currentChallenge.title}：${currentChallenge.description}`;

function getJSTDateKey() {

  const parts =
    new Intl.DateTimeFormat(
      "en-US",
      {
        timeZone:
          "Asia/Tokyo",
        year:
          "numeric",
        month:
          "2-digit",
        day:
          "2-digit"
      }
    ).formatToParts(
      new Date()
    );

  const values = {};

  for (
    const part
    of parts
  ) {

    values[
      part.type
    ] =
      part.value;
  }

  return (
    values.year +
    "-" +
    values.month +
    "-" +
    values.day
  );
}


function getJSTDateText() {

  const parts =
    getJSTDateKey()
      .split("-");

  return (
    parts[0] +
    "/" +
    parts[1] +
    "/" +
    parts[2]
  );
}


function hashSeed(text) {

  let hash =
    2166136261;

  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    hash ^=
      text.charCodeAt(i);

    hash =
      Math.imul(
        hash,
        16777619
      );
  }

  return hash >>> 0;
}


function createSeededRandom(text) {

  let seed =
    hashSeed(text);

  return function() {

    seed +=
      0x6D2B79F5;

    let t =
      seed;

    t =
      Math.imul(
        t ^ (t >>> 15),
        t | 1
      );

    t ^=
      t +
      Math.imul(
        t ^ (t >>> 7),
        t | 61
      );

    return (
      (
        t ^
        (t >>> 14)
      ) >>> 0
    ) / 4294967296;
  };
}


function seededShuffle(
  array,
  random
) {

  const shuffled =
    [...array];

  for (
    let i =
      shuffled.length - 1;
    i > 0;
    i--

function getRandomNature(

) {

  const available =
    pokemonNatures.filter(

    }

    }

    if (
      rule ===
      "レギュレーション J"
    ) {
      return svItemsJ;
    }
  }

  return [];
}


function shuffleArray(array) {

  const shuffled =
    [...array];

  for (
    let i =
      shuffled.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );

    [
      shuffled[i],
      shuffled[j]
    ] = [
      shuffled[j],
      shuffled[i]
    ];
  }

  return shuffled;
}


function getSpeciesKey(name) {

  if (!name) {
    return "";
  }

  return name
    .replace(
      /（.*?）/g,
      ""
    )
    .trim();
}


function hasSameSpecies(
  team,
  pokemonName
) {

  const key =
    getSpeciesKey(
      pokemonName
    );

  return team.some(
    pokemon =>
      pokemon &&
      getSpeciesKey(
        pokemon
      ) === key
  );
}


function isSVJSpecialPokemon(
  pokemonName
) {

  if (
    typeof svRegJSpecial ===
    "undefined"
  ) {
    return false;
  }

  return svRegJSpecial.includes(
    pokemonName
  );
}


function countSpecialPokemon(
  team
) {

  return team.filter(
    pokemon =>
      pokemon &&
      isSVJSpecialPokemon(
        pokemon
      )
  ).length;
}


function chooseMegaOption(
  pokemonName
) {

  if (
    !isChampions()
  ) {
    return null;
  }

  const options =
    getMegaOptions(
      pokemonName,
      rule
    );

  if (
    options.length === 0
  ) {
    return null;
  }

  return options[
    Math.floor(
      Math.random() *
      options.length
    )
  ];
}


/* =========================
   通常チーム生成
========================= */

function buildNormalTeam(
  pool
) {

  const shuffled =
    shuffleArray(
      pool
    );

  const team = [];

  for (
    const pokemon
    of shuffled
  ) {

    if (
      hasSameSpecies(
        team,
        pokemon
      )
    ) {
      continue;
    }

    team.push(
      pokemon
    );

    if (
      team.length === 6
    ) {
      break;
    }
  }

  return team;
}


function buildSVRegJTeam(
  pool
) {

  const shuffled =
    shuffleArray(
      pool
    );

  const team = [];

  let specialCount = 0;

  const maxSpecial =
    getChallengeMaxSpecial();

  for (
    const pokemon
    of shuffled
  ) {

    if (
      hasSameSpecies(
        team,
        pokemon
      )
    ) {
      continue;
    }

    const isSpecial =
      isSVJSpecialPokemon(
        pokemon
      );

    if (
      isSpecial &&
      specialCount >=
        maxSpecial
    ) {
      continue;
    }

    team.push(
      pokemon
    );

    if (
      isSpecial
    ) {
      specialCount++;
    }

    if (
      team.length === 6
    ) {
      break;
    }
  }

  return team;
}


function buildTeam() {

  const pool =
    getPokemonPool();

  const itemPool =
    getItemPool();

  if (
    isSV()
  ) {

    currentMegaEnabled =
      false;

    currentMegaIndex =
      -1;

    currentMegaStone =
      "";

    currentTeam =
      isSVRegJ()
        ? buildSVRegJTeam(
            pool
          )
        : buildNormalTeam(
            pool
          );

    currentItems =
      shuffleArray(
        itemPool
      ).slice(
        0,
        6
      );

    return;
  }

  currentMegaEnabled =
    challengeBlocksMega()
      ? false
      : Math.random() < 0.5;

  currentMegaIndex =
    -1;

  currentMegaStone =
    "";

  if (
    currentMegaEnabled
  ) {

    const megaCandidates =
      pool.filter(
        name =>
          getMegaOptions(
            name,
            rule
          ).length > 0
      );

    if (
      megaCandidates.length > 0
    ) {

      const megaPokemon =
        megaCandidates[
          Math.floor(
            Math.random() *
            megaCandidates.length
          )
        ];

      const remainingPool =
        pool.filter(
          name =>
            getSpeciesKey(
              name
            ) !==
            getSpeciesKey(
              megaPokemon
            )
        );

      const otherFive =
        buildNormalTeam(
          remainingPool
        ).slice(
          0,
          5
        );

      currentTeam =
        shuffleArray([
          megaPokemon,
          ...otherFive
        ]);

      currentMegaIndex =
        currentTeam.indexOf(
          megaPokemon
        );

      const megaOption =
        chooseMegaOption(
          megaPokemon
        );

      currentMegaStone =
        megaOption
          ? megaOption.stone
          : "";

    } else {

      currentMegaEnabled =
        false;

      currentTeam =
        buildNormalTeam(
          pool
        );
    }

  } else {

    currentTeam =
      buildNormalTeam(
        pool
      );
  }

  currentItems =
    shuffleArray(
      itemPool
    ).slice(
      0,
      6
    );

  if (
    currentMegaEnabled &&
    currentMegaIndex >= 0 &&
    currentMegaStone
  ) {

    currentItems[
      currentMegaIndex
    ] =
      currentMegaStone;
  }
}

/* =========================

========================= */

function buildSVTeamWithLocks() {

  const pool =
    getPokemonPool();

  const nextTeam =
    Array(6).fill("");

  for (
    let i = 0;
    i < 6;
    i++
  ) {

    if (
      lockedSlots[i]
    ) {

      nextTeam[i] =
        currentTeam[i];
    }
  }

  let specialCount =
    isSVRegJ()
      ? countSpecialPokemon(
          nextTeam
        )
      : 0;

  const maxSpecial =
    getChallengeMaxSpecial();

  const shuffled =
    shuffleArray(
      pool
    );

  for (
    let i = 0;
    i < 6;
    i++
  ) {

    if (
      lockedSlots[i]
    ) {
      continue;
    }

    let foundIndex =
      -1;

    for (
      let j = 0;
      j < shuffled.length;
      j++
    ) {

      const pokemon =
        shuffled[j];

      if (
        hasSameSpecies(
          nextTeam,
          pokemon
        )
      ) {
        continue;
      }

      if (
        isSVRegJ() &&
        specialCount >=
          maxSpecial &&
        isSVJSpecialPokemon(
          pokemon
        )
      ) {
        continue;
      }

      foundIndex =
        j;

      break;
    }

    if (
      foundIndex < 0
    ) {
      return false;
    }

    const pokemon =
      shuffled.splice(
        foundIndex,
        1
      )[0];

    nextTeam[i] =
      pokemon;

    if (
      isSVRegJ() &&
      isSVJSpecialPokemon(
        pokemon
      )
    ) {
      specialCount++;
    }
  }

  currentTeam =
    nextTeam;

  currentMegaEnabled =
    false;

  currentMegaIndex =
    -1;

  currentMegaStone =
    "";

  return true;
}


function buildChampionsTeamWithLocks() {

  const pool =
    getPokemonPool();

  const nextTeam =
    Array(6).fill("");

  for (
    let i = 0;
    i < 6;
    i++
  ) {

    if (
      lockedSlots[i]
    ) {

      nextTeam[i] =
        currentTeam[i];
    }
  }

  const oldMegaIndex =
    currentMegaIndex;

  const oldMegaStone =
    currentMegaStone;

  const lockedMegaIndex =
    (
      currentMegaEnabled &&
      oldMegaIndex >= 0 &&
      lockedSlots[
        oldMegaIndex
      ] &&
      !challengeBlocksMega()
    )
      ? oldMegaIndex
      : -1;

  if (
    lockedMegaIndex >= 0
  ) {

    currentMegaEnabled =
      true;

    currentMegaIndex =
      lockedMegaIndex;

    currentMegaStone =
      oldMegaStone;

  } else {

    currentMegaEnabled =
      challengeBlocksMega()
        ? false
        : Math.random() < 0.5;

    currentMegaIndex =
      -1;

    currentMegaStone =
      "";

    if (
      currentMegaEnabled
    ) {

      const unlockedIndices =
        [];

      for (
        let i = 0;
        i < 6;
        i++
      ) {

        if (
          !lockedSlots[i]
        ) {
          unlockedIndices.push(i);
        }
      }

      const megaCandidates =
        pool.filter(
          pokemon => {

            if (
              hasSameSpecies(
                nextTeam,
                pokemon
              )
            ) {
              return false;
            }

            return (
              getMegaOptions(
                pokemon,
                rule
              ).length > 0
            );
          }
        );

      if (
        unlockedIndices.length > 0 &&
        megaCandidates.length > 0
      ) {

        const megaPokemon =
          megaCandidates[
            Math.floor(
              Math.random() *
              megaCandidates.length
            )
          ];

        const targetIndex =
          unlockedIndices[
            Math.floor(
              Math.random() *
              unlockedIndices.length
            )
          ];

        nextTeam[
          targetIndex
        ] =
          megaPokemon;

        currentMegaIndex =
          targetIndex;

        const megaOption =
          chooseMegaOption(
            megaPokemon
          );

        currentMegaStone =
          megaOption
            ? megaOption.stone
            : "";

      } else {

        currentMegaEnabled =
          false;
      }
    }
  }

  const shuffled =
    shuffleArray(
      pool
    );

  for (
    let i = 0;
    i < 6;
    i++
  ) {

    if (
      nextTeam[i]
    ) {
      continue;
    }

    let foundIndex =
      -1;

    for (
      let j = 0;
      j < shuffled.length;
      j++
    ) {

      const pokemon =
        shuffled[j];

      if (
        hasSameSpecies(
          nextTeam,
          pokemon
        )
      ) {
        continue;
      }

      foundIndex =
        j;

      break;
    }

    if (
      foundIndex < 0
    ) {
      return false;
    }

    nextTeam[i] =
      shuffled.splice(
        foundIndex,
        1
      )[0];
  }

  currentTeam =
    nextTeam;

  return true;
}


function rebuildItemsWithLocks() {

  const itemPool =
    getItemPool();

  const nextItems =
    Array(6).fill("");

  const usedItems =
    new Set();

  for (
    let i = 0;
    i < 6;
    i++
  ) {

    if (
      lockedSlots[i] &&
      currentItems[i]
    ) {

      nextItems[i] =
        currentItems[i];

      usedItems.add(
        currentItems[i]
      );
    }
  }

  if (
    isChampions() &&
    currentMegaEnabled &&
    currentMegaIndex >= 0 &&
    !lockedSlots[
      currentMegaIndex
    ]
  ) {

    nextItems[
      currentMegaIndex
    ] =
      currentMegaStone;

    if (
      currentMegaStone
    ) {

      usedItems.add(
        currentMegaStone
      );
    }
  }

  const availableItems =
    shuffleArray(
      itemPool.filter(
        item =>
          !usedItems.has(
            item
          )
      )
    );

  for (
    let i = 0;
    i < 6;
    i++
  ) {

    if (
      lockedSlots[i]
    ) {
      continue;
    }

    if (
      isChampions() &&
      currentMegaEnabled &&
      i === currentMegaIndex
    ) {
      continue;
    }

    const nextItem =
      availableItems.shift();

    if (
      !nextItem
    ) {
      return false;
    }

    nextItems[i] =
      nextItem;
  }

  currentItems =
    nextItems;

  return true;
}


function rebuildNaturesWithLocks() {

  const nextNatures =
    Array(6).fill("");

  for (
    let i = 0;
    i < 6;
    i++
  ) {

    if (
      lockedSlots[i]
    ) {

      nextNatures[i] =
        currentNatures[i];

    } else {

      nextNatures[i] =
        getRandomNature();
    }
  }

  currentNatures =
    nextNatures;
}


function rebuildUnlockedSlots() {

  let success =
    false;

  if (
    isSV()
  ) {

    success =
      buildSVTeamWithLocks();

  } else {

    success =
      buildChampionsTeamWithLocks();
  }

  if (
    !success
  ) {
    return false;
  }

  if (
    !rebuildItemsWithLocks()
  ) {
    return false;
  }

  rebuildNaturesWithLocks();

  return true;
}

async function drawPokemon() {

  const pool =
    getPokemonPool();

  const itemPool =
    getItemPool();

  if (
    pool.length < 6 ||
    itemPool.length < 6
  ) {

    document.getElementById(
      "message"
    ).textContent =
      "このルールのデータはまだ登録されていません。";

    return;
  }

  const hasCurrentTeam =
    currentTeam.length === 6;

  const lockedCount =
    lockedSlots.filter(
      Boolean
    ).length;

  if (
    hasCurrentTeam &&
    lockedCount === 6
  ) {

    document.getElementById(
      "message"
    ).textContent =
      "6匹すべて固定されています。固定を解除してから再抽選してください。";

    return;
  }

  hideOldPreview();

  if (
    hasCurrentTeam &&
    lockedCount > 0
  ) {

    const success =
      rebuildUnlockedSlots();

    if (
      !success
    ) {

      document.getElementById(
        "message"
      ).textContent =
        "再抽選できませんでした。データを確認してください。";

      return;
    }

    currentImageUrls =
      Array(6).fill("");

    await renderAllSlots();

    showResultButtons();

    updateDrawButtonLabel();

    setChallengeMessage();

    saveCurrentHistory();

    return;
  }

  lockedSlots =
    Array(6).fill(false);

  buildTeam();

  if (
    currentTeam.length < 6
  ) {

    document.getElementById(
      "message"
    ).textContent =
      "6匹を抽選できませんでした。データを確認してください。";

    return;
  }

  currentNatures = [];
  currentImageUrls = [];

  for (
    let i = 0;
    i < 6;
    i++
  ) {

    currentNatures.push(
      getRandomNature()
    );
  }

  await renderAllSlots();

  showResultButtons();

  updateDrawButtonLabel();

  setChallengeMessage();

  saveCurrentHistory();
}


/* =========================
   個別引き直し
========================= */

function getAvailableNormalItem(
  index
) {

  const itemPool =
    getItemPool();

  const usedItems =
    currentItems.filter(
      (_, i) =>
        i !== index
    );

  const currentItem =
    currentItems[index];

  const availableItems =
    itemPool.filter(
      item =>
        item !== currentItem &&
        !usedItems.includes(
          item
        )
    );

  if (
    availableItems.length === 0
  ) {
    return "";
  }

  return availableItems[
    Math.floor(
      Math.random() *
      availableItems.length
    )
  ];
}


function getAvailablePokemon(
  index
) {

  const pool =
    getPokemonPool();

  const otherPokemon =
    currentTeam.filter(
      (_, i) =>
        i !== index
    );

  return pool.filter(
    pokemon => {

      if (
        pokemon ===
        currentTeam[index]
      ) {
        return false;
      }

      if (
        hasSameSpecies(
          otherPokemon,
          pokemon
        )
      ) {
        return false;
      }

      if (
        isSVRegJ()
      ) {

        const otherSpecialCount =
          countSpecialPokemon(
            otherPokemon
          );

        if (
          otherSpecialCount >=
            getChallengeMaxSpecial() &&
          isSVJSpecialPokemon(
            pokemon
          )
        ) {
          return false;
        }
      }

      return true;
    }
  );
}


function getAvailableMegaPokemon(
  index
) {

  if (
    !isChampions() ||
    challengeBlocksMega()
  ) {
    return [];
  }

  return getAvailablePokemon(
    index
  ).filter(
    pokemon =>
      getMegaOptions(
        pokemon,
        rule
      ).length > 0
  );
}


async function rerollPokemon(
  index
) {

  if (
    challengeBlocksPokemonReroll()
  ) {

    document.getElementById(
      "message"
    ).textContent =
      "🔥 このチャレンジではポケモンの引き直しは禁止です。";

    return;
  }

  if (
    currentTeam.length !== 6
  ) {
    return;
  }

  if (
    lockedSlots[index]
  ) {
    return;
  }

  const oldPokemon =
    currentTeam[index];

  const isMegaSlot =
    isChampions() &&
    currentMegaEnabled &&
    index ===
      currentMegaIndex;

  if (
    isMegaSlot
  ) {

    const megaPool =
      getAvailableMegaPokemon(
        index
      );

    if (
      megaPool.length === 0
    ) {
      return;
    }

    const newPokemon =
      megaPool[
        Math.floor(
          Math.random() *
          megaPool.length
        )
      ];

    const megaOption =
      chooseMegaOption(
        newPokemon
      );

    currentTeam[index] =
      newPokemon;

    currentMegaStone =
      megaOption
        ? megaOption.stone
        : "";

    currentItems[index] =
      currentMegaStone;

  } else {

    const availablePokemon =
      getAvailablePokemon(
        index
      );

    if (
      availablePokemon.length === 0
    ) {
      return;
    }

    currentTeam[index] =
      availablePokemon[
        Math.floor(
          Math.random() *
          availablePokemon.length
        )
      ];

    currentItems[index] =
      getAvailableNormalItem(
        index
      );
  }

  currentNatures[index] =
    getRandomNature(
      currentNatures[index]
    );

  hideOldPreview();

  await renderSlot(
    index
  );

  saveCurrentHistory();

  document.getElementById(
    "message"
  ).textContent =
    `${oldPokemon}を引き直しました。`;
}

  if (

  ) {

  const isMegaSlot =

/* =========================
   保存データ
========================= */

function createCurrentSnapshot() {

  return {

    game:
      game,

    rule:
      rule,

    team:
      [...currentTeam],

    items:
      [...currentItems],

    natures:
      [...currentNatures],

    megaEnabled:
      currentMegaEnabled,

    megaIndex:
      currentMegaIndex,

    megaStone:
      currentMegaStone
  };
}


function isSameSnapshot(
  a,
  b
) {

  return (
    a.game === b.game &&
    a.rule === b.rule &&
    JSON.stringify(
      a.team
    ) ===
      JSON.stringify(
        b.team
      ) &&
    JSON.stringify(
      a.items
    ) ===
      JSON.stringify(
        b.items
      ) &&
    JSON.stringify(
      a.natures
    ) ===
      JSON.stringify(
        b.natures
      ) &&
    a.megaEnabled ===
      b.megaEnabled &&
    a.megaIndex ===
      b.megaIndex &&
    a.megaStone ===
      b.megaStone
  );
}


function formatSavedDate(
  timestamp
) {

  const date =
    new Date(
      timestamp
    );

  return (
    date.getFullYear() +
    "/" +
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    ) +
    "/" +
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    ) +
    " " +
    String(
      date.getHours()
    ).padStart(
      2,
      "0"
    ) +
    ":" +
    String(
      date.getMinutes()
    ).padStart(
      2,
      "0"
    )
  );
}


async function applySavedSnapshot(
  saved,
  message
) {

  challengeModeActive =
    false;

  currentChallenge =
    null;

  updateChallengePanel();

  currentTeam =
    [...saved.team];

  currentItems =
    [...saved.items];

  currentNatures =
    [...saved.natures];

  currentMegaEnabled =
    Boolean(
      saved.megaEnabled
    );

  currentMegaIndex =
    Number.isInteger(
      saved.megaIndex
    )
      ? saved.megaIndex
      : -1;

  currentMegaStone =
    saved.megaStone || "";

  currentImageUrls =
    Array(6).fill("");

  lockedSlots =
    Array(6).fill(false);

  hideOldPreview();

  await renderAllSlots();

  showResultButtons();

  updateDrawButtonLabel();

  document.getElementById(
    "message"
  ).textContent =
    message;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================
   お気に入り
========================= */

function getFavorites() {

  try {

    const saved =
      localStorage.getItem(
        FAVORITES_KEY
      );

    if (
      !saved
    ) {
      return [];
    }

    const parsed =
      JSON.parse(
        saved
      );

    return Array.isArray(
      parsed
    )
      ? parsed
      : [];

  } catch (
    error
  ) {

    return [];
  }
}


function saveFavorites(
  favorites
) {

  localStorage.setItem(
    FAVORITES_KEY,
    JSON.stringify(
      favorites
    )
  );
}


function getCurrentRuleFavorites() {

  return getFavorites()
    .filter(
      favorite =>
        favorite.game === game &&
        favorite.rule === rule
    )
    .sort(
      (a, b) =>
        b.createdAt -
        a.createdAt
    );
}


function saveCurrentFavorite() {

  if (
    currentTeam.length !== 6
  ) {
    return;
  }

  const favorites =
    getFavorites();

  const snapshot =
    createCurrentSnapshot();

  const alreadySaved =
    favorites.some(
      favorite =>
        isSameSnapshot(
          favorite,
          snapshot
        )
    );

  if (
    alreadySaved
  ) {

    document.getElementById(
      "message"
    ).textContent =
      "この構築はすでにお気に入りに保存されています。";

    return;
  }

  favorites.push({

    id:
      Date.now()
        .toString() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2, 8),

    createdAt:
      Date.now(),

    ...snapshot
  });

  saveFavorites(
    favorites
  );

  renderFavorites();

  document.getElementById(
    "message"
  ).textContent =
    "⭐ この構築をお気に入りに保存しました！";
}


function renderFavorites() {

  const list =
    document.getElementById(
      "favoritesList"
    );

  const favorites =
    getCurrentRuleFavorites();

  if (
    favorites.length === 0
  ) {

    list.innerHTML = `
      <div class="storage-empty">
        まだお気に入りはありません。
      </div>
    `;

    return;
  }

  list.innerHTML =
    favorites.map(
      favorite => {

        const teamText =
          favorite.team.join(
            " / "
          );

        const megaText =
          favorite.megaEnabled &&
          favorite.megaIndex >= 0

            ? `
              <div class="mega-label">
                ⭐ メガ枠：
                ${favorite.team[favorite.megaIndex]}
              </div>
            `

            : "";

        return `
          <div class="storage-card">

            <div class="storage-date">
              ${formatSavedDate(
                favorite.createdAt
              )}
            </div>

            ${megaText}

            <div class="storage-team">
              ${teamText}
            </div>

            <div class="storage-actions">

              <button
                class="storage-load"
                onclick="loadFavorite('${favorite.id}')">
                呼び出す
              </button>

              <button
                class="storage-delete"
                onclick="deleteFavorite('${favorite.id}')">
                削除
              </button>

            </div>

          </div>
        `;
      }
    ).join("");
}


async function loadFavorite(
  id
) {

  const favorite =
    getFavorites().find(
      item =>
        item.id === id
    );

  if (
    !favorite
  ) {
    return;
  }

  await applySavedSnapshot(
    favorite,
    "⭐ お気に入りの構築を呼び出しました。"
  );
}


function deleteFavorite(
  id
) {

  const favorites =
    getFavorites().filter(
      favorite =>
        favorite.id !== id
    );

  saveFavorites(
    favorites
  );

  renderFavorites();

  document.getElementById(
    "message"
  ).textContent =
    "お気に入りを削除しました。";
}


/* =========================
   抽選履歴
========================= */

function getHistory() {

  try {

    const saved =
      localStorage.getItem(
        HISTORY_KEY
      );

    if (
      !saved
    ) {
      return [];
    }

    const parsed =
      JSON.parse(
        saved
      );

    return Array.isArray(
      parsed
    )
      ? parsed
      : [];

  } catch (
    error
  ) {

    return [];
  }
}


function saveHistory(
  history
) {

  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(
      history
    )
  );
}


function getCurrentRuleHistory() {

  return getHistory()
    .filter(
      item =>
        item.game === game &&
        item.rule === rule
    )
    .sort(
      (a, b) =>
        b.createdAt -
        a.createdAt
    );
}


function saveCurrentHistory() {

  if (
    currentTeam.length !== 6
  ) {
    return;
  }

  const allHistory =
    getHistory();

  const snapshot =
    createCurrentSnapshot();

  const currentRuleHistory =
    allHistory
      .filter(
        item =>
          item.game === game &&
          item.rule === rule
      )
      .sort(
        (a, b) =>
          b.createdAt -
          a.createdAt
      );

  const latest =
    currentRuleHistory[0];

  if (
    latest &&
    isSameSnapshot(
      latest,
      snapshot
    )
  ) {
    return;
  }

  const newEntry = {

    id:
      Date.now()
        .toString() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2, 8),

    createdAt:
      Date.now(),

    ...snapshot
  };

  let nextHistory = [
    newEntry,
    ...allHistory
  ];

  const sameRule =
    nextHistory
      .filter(
        item =>
          item.game === game &&
          item.rule === rule
      )
      .sort(
        (a, b) =>
          b.createdAt -
          a.createdAt
      );

  const keepIds =
    new Set(
      sameRule
        .slice(
          0,
          HISTORY_LIMIT
        )
        .map(
          item =>
            item.id
        )
    );

  nextHistory =
    nextHistory.filter(
      item => {

        if (
          item.game !== game ||
          item.rule !== rule
        ) {
          return true;
        }

        return keepIds.has(
          item.id
        );
      }
    );

  saveHistory(
    nextHistory
  );

  renderHistory();
}


function renderHistory() {

  const list =
    document.getElementById(
      "historyList"
    );

  const clearButton =
    document.getElementById(
      "historyClearButton"
    );

  const history =
    getCurrentRuleHistory();

  if (
    history.length === 0
  ) {

    clearButton.style.display =
      "none";

    list.innerHTML = `
      <div class="storage-empty">
        まだ抽選履歴はありません。
      </div>
    `;

    return;
  }

  clearButton.style.display =
    "block";

  list.innerHTML =
    history.map(
      item => {

        const teamText =
          item.team.join(
            " / "
          );

        const megaText =
          item.megaEnabled &&
          item.megaIndex >= 0

            ? `
              <div class="mega-label">
                ⭐ メガ枠：
                ${item.team[item.megaIndex]}
              </div>
            `

            : "";

        return `
          <div class="storage-card">

            <div class="storage-date">
              ${formatSavedDate(
                item.createdAt
              )}
            </div>

            ${megaText}

            <div class="storage-team">
              ${teamText}
            </div>

            <div class="storage-actions">

              <button
                class="storage-load"
                onclick="loadHistory('${item.id}')">
                呼び出す
              </button>

              <button
                class="storage-delete"
                onclick="deleteHistory('${item.id}')">
                削除
              </button>

            </div>

          </div>
        `;
      }
    ).join("");
}


async function loadHistory(
  id
) {

  const item =
    getHistory().find(
      historyItem =>
        historyItem.id === id
    );

  if (
    !item
  ) {
    return;
  }

  await applySavedSnapshot(
    item,
    "🕘 履歴の構築を呼び出しました。"
  );
}


function deleteHistory(
  id
) {

  const history =
    getHistory().filter(
      item =>
        item.id !== id
    );

  saveHistory(
    history
  );

  renderHistory();

  document.getElementById(
    "message"
  ).textContent =
    "履歴を1件削除しました。";
}


function clearCurrentHistory() {

  const history =
    getHistory().filter(
      item =>
        !(
          item.game === game &&
          item.rule === rule
        )
    );

  saveHistory(
    history
  );

  renderHistory();

  document.getElementById(
    "message"
  ).textContent =
    "このレギュレーションの履歴をすべて削除しました。";
}


/* =========================
   シェア画像
========================= */

function loadImageForCanvas(
  src
) {

  return new Promise(
    resolve => {

      if (
        !src
      ) {

        resolve(
          null
        );

        return;
      }

      const img =
        new Image();

      img.crossOrigin =
        "anonymous";

      img.onload =
        () =>
          resolve(
            img
          );

      img.onerror =
        () =>
          resolve(
            null
          );

      img.src =
        src;
    }
  );
}


function drawRoundedRect(
  ctx,
  x,
  y,
  width,
  height,
  radius,
  fillStyle
) {

  ctx.beginPath();

  ctx.roundRect(
    x,
    y,
    width,
    height,
    radius
  );

  ctx.fillStyle =
    fillStyle;

  ctx.fill();

  ctx.closePath();
}


async function createShareImage() {

  if (
    currentTeam.length !== 6
  ) {
    return;
  }

  document.getElementById(
    "message"
  ).textContent =
    "シェア画像を作成中…";

  currentImageUrls =
    await Promise.all(
      currentTeam.map(
        name =>
          getPokemonImage(
            name
          )
      )
    );

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    1080;

  canvas.height =
    1350;

  const ctx =
    canvas.getContext(
      "2d"
    );

  ctx.fillStyle =
    "#f5f6f8";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawRoundedRect(
    ctx,
    50,
    40,
    980,
    1260,
    36,
    "#ffffff"
  );

  ctx.textAlign =
    "center";

  ctx.fillStyle =
    "#222";

  ctx.font =
    "900 60px sans-serif";

  ctx.fillText(
    "🎲 ポケくじ",
    540,
    120
  );

  ctx.fillStyle =
    "#666";

  ctx.font =
    "700 25px sans-serif";

  ctx.fillText(
    game,
    540,
    165
  );

  ctx.fillStyle =
    "#777";

  ctx.font =
    "700 29px sans-serif";

  ctx.fillText(
    rule,
    540,
    205
  );

  const loadedImages =
    await Promise.all(
      currentImageUrls.map(
        url =>
          loadImageForCanvas(
            url
          )
      )
    );

  const cardWidth =
    430;

  const cardHeight =
    285;

  const startX =
    90;

  const startY =
    235;

  const gapX =
    40;

  const gapY =
    25;

  for (
    let i = 0;
    i < 6;
    i++
  ) {

    const col =
      i % 2;

    const row =
      Math.floor(
        i / 2
      );

    const x =
      startX +
      col *
      (
        cardWidth +
        gapX
      );

    const y =
      startY +
      row *
      (
        cardHeight +
        gapY
      );

    const isMega =
      isChampions() &&
      currentMegaEnabled &&
      i ===
        currentMegaIndex;

    drawRoundedRect(
      ctx,
      x,
      y,
      cardWidth,
      cardHeight,
      28,
      isMega
        ? "#fff7e6"
        : "#f3f4f6"
    );

    if (
      isMega
    ) {

      ctx.fillStyle =
        "#b87300";

      ctx.font =
        "900 20px sans-serif";

      ctx.fillText(
        "⭐ メガ枠",
        x +
        cardWidth / 2,
        y + 27
      );
    }

    const img =
      loadedImages[i];

    if (
      img
    ) {

      const imageSize =
        120;

      ctx.drawImage(
        img,
        x +
        (
          cardWidth -
          imageSize
        ) / 2,
        y + 30,
        imageSize,
        imageSize
      );
    }

    ctx.fillStyle =
      "#222";

    ctx.font =
      "800 27px sans-serif";

    ctx.fillText(
      currentTeam[i],
      x +
      cardWidth / 2,
      y + 175,
      cardWidth - 30
    );

    ctx.fillStyle =
      isMega
        ? "#9a6500"
        : "#666";

    ctx.font =
      "600 21px sans-serif";

    ctx.fillText(
      `持ち物：${currentItems[i]}`,
      x +
      cardWidth / 2,
      y + 218,
      cardWidth - 30
    );

    ctx.fillStyle =
      "#666";

    ctx.fillText(
      `性格：${currentNatures[i]}`,
      x +
      cardWidth / 2,
      y + 252,
      cardWidth - 30
    );
  }

  ctx.fillStyle =
    "#888";

  ctx.font =
    "600 23px sans-serif";

  ctx.fillText(
    `#ポケくじ  ${getGameHashtag()}`,
    540,
    1225
  );

  const blob =
    await new Promise(
      resolve => {

        canvas.toBlob(
          resolve,
          "image/png",
          1
        );
      }
    );

  if (
    !blob
  ) {

    document.getElementById(
      "message"
    ).textContent =
      "シェア画像を作成できませんでした。";

    return;
  }

  shareImageBlob =
    blob;

  if (
    previewObjectUrl
  ) {

    URL.revokeObjectURL(
      previewObjectUrl
    );
  }

  previewObjectUrl =
    URL.createObjectURL(
      blob
    );

  document.getElementById(
    "sharePreviewImage"
  ).src =
    previewObjectUrl;

  document.getElementById(
    "sharePreview"
  ).classList.add(
    "show"
  );

  document.getElementById(
    "message"
  ).textContent =
    "シェア画像を作成しました！";
}


function hideOldPreview() {

  document.getElementById(
    "sharePreview"
  ).classList.remove(

}


async function shareResult() {

  if (
    currentTeam.length !== 6
  ) {
    return;
  }

  if (
    !shareImageBlob
  ) {
    await createShareImage();
  }

  if (
    !shareImageBlob
  ) {
    return;
  }

  const teamText =
    currentTeam.join(
      " / "
    );

  const megaText =
    isChampions() &&
    currentMegaEnabled &&
    currentMegaIndex >= 0

      ? `\n⭐ メガ枠：${currentTeam[currentMegaIndex]}（${currentMegaStone}）\n`

      : "";

  const challengeText =
    challengeModeActive &&
    currentChallenge

      ? `\n🔥 チャレンジ：${currentChallenge.title}\n`

      : "";

  const shareText =
`🎲 ポケくじでランダム構築！

${game}
${rule}
${challengeText}
${teamText}
${megaText}
#ポケくじ ${getGameHashtag()}`;

  const shareUrl =
    "https://nico25dayo.github.io/poke-kuji/";

  const file =
    new File(
      [shareImageBlob],
      "poke-kuji-result.png",
      {
        type:
          "image/png"
      }
    );

  const canShareFile =
    navigator.canShare &&
    navigator.canShare({
      files:
        [file]
    });

  if (
    navigator.share &&
    canShareFile
  ) {

    try {

      await navigator.share({
        title:
          "ポケくじ",

        text:
          shareText,

        url:
          shareUrl,

        files:
          [file]
      });

    } catch (
      error
    ) {

      console.log(
        "共有をキャンセルしました。"
      );
    }

    return;
  }

  if (
    navigator.share
  ) {

    try {

      await navigator.share({
        title:
          "ポケくじ",

        text:
          shareText,

        url:
          shareUrl
      });

    } catch (
      error
    ) {

      console.log(
        "共有をキャンセルしました。"
      );
    }

    return;
  }

  await navigator.clipboard
    .writeText(
      shareText +
      "\n" +
      shareUrl
    );

  document.getElementById(
    "message"
  ).textContent =
    "共有文をコピーしました！";
}
