<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケくじ - 抽選</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding: 28px 20px 60px;
    }

    .back {
      display: inline-block;
      margin-bottom: 35px;
      color: #555;
      text-decoration: none;
      font-weight: 700;
    }

    header {
      text-align: center;
      margin-bottom: 45px;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .game {
      font-size: 14px;
      color: #777;
      margin-bottom: 5px;
    }

    .rule {
      font-size: 20px;
      font-weight: 800;
    }

    .result {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }

    .pokemon {
      min-height: 110px;
      border-radius: 16px;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      text-align: center;
      font-weight: 700;
      color: #777;
    }

    .draw-button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 18px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .message {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 13px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <main class="app">

    <a class="back" href="index.html">
      ← 戻る
    </a>

    <header>
      <div class="logo">🎲 ポケくじ</div>

      <div id="gameName" class="game">
        Pokémon Champions
      </div>

      <div id="ruleName" class="rule">
        レギュレーション
      </div>
    </header>


    <div class="result">

      <div class="pokemon">？</div>
      <div class="pokemon">？</div>
      <div class="pokemon">？</div>
      <div class="pokemon">？</div>
      <div class="pokemon">？</div>
      <div class="pokemon">？</div>

    </div>


    <button class="draw-button" onclick="drawPokemon()">
      🎲 6匹を抽選する
    </button>

    <div class="message">
      次の工程で、選択したレギュレーションに対応した<br>
      ポケモンをここにランダム表示します。
    </div>

  </main>


  <script>

    const params = new URLSearchParams(window.location.search);

    const game = params.get("game");
    const rule = params.get("rule");

    if (game) {
      document.getElementById("gameName").textContent = game;
    }

    if (rule) {
      document.getElementById("ruleName").textContent = rule;
    }


    function drawPokemon() {

      alert(
        "次にポケモンデータを入れて、ここを本物の抽選にします！"
      );

    }

  </script>

</body>
</html>
